name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        shell: bash
        run: |
          PYTHONPATH=src python -m unittest discover -s tests

  build-check:
    name: Package Build & Distribution Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine flit-core

      - name: Build distributions
        run: |
          python -m build

      - name: Validate distribution metadata
        run: |
          twine check --strict dist/*

      - name: Validate standalone zipapp creation
        run: |
          mkdir -p dist
          python -m zipapp src -m "espresso.cli:main" -o dist/espresso.pyz -p "/usr/bin/env python3"
          chmod +x dist/espresso.pyz
          ./dist/espresso.pyz --version
          ./dist/espresso.pyz list
