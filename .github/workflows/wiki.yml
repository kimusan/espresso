name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/publish_wiki.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Build & Sync GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and Publish Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_wiki.py --push --token "${GITHUB_TOKEN}" --repo "kimusan/espresso"
